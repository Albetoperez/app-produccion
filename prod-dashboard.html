<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGMA Control - PM Strategic Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --blue: #005596; --accent-orange: #ff9800;
            --hinca: #ffeb3b; --posthead: #2196f3;
            --torque: #9c27b0; --omega: #00bcd4; --modulo: #4caf50;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f3f7; margin: 0; padding: 20px; color: #333; }
        
        /* --- CABECERA CORPORATIVA --- */
        header { 
            background: var(--blue); color: white; padding: 15px 25px; border-radius: 12px; 
            margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .brand { font-weight: 900; color: var(--accent-orange); font-size: 1.2rem; border-right: 2px solid var(--accent-orange); padding-right: 10px; }
        .app-name { color: #e0e0e0; font-weight: bold; font-size: 0.9rem;}
        
        .nav-container { display: flex; gap: 10px; align-items: center; }
        .btn-nav-outline { background: #ffffff; color: var(--blue); border: 2px solid var(--blue); padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 13px; transition: all 0.2s; display: inline-block; }
        .btn-nav-outline:hover { background: #f0f7ff; transform: translateY(-1px); }

        /* --- COMPONENTES DEL DASHBOARD --- */
        .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .kpi-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border-top: 5px solid var(--blue); }
        .kpi-card h3 { margin: 0; font-size: 12px; color: #666; text-transform: uppercase; }
        .kpi-card p { margin: 10px 0 0; font-size: 20px; font-weight: 900; color: var(--blue); }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 12px 25px; background: #e0e0e0; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab.active { background: var(--blue); color: white; }
        
        .view { display: none; }
        .view.active { display: block; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .full-width { grid-column: 1 / -1; }
        h2 { margin-top: 0; color: var(--blue); font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #fcfcfc; color: #888; text-transform: uppercase; font-size: 11px; text-align: center; padding: 15px; border-bottom: 2px solid #eee; }
        td { padding: 10px; border-bottom: 1px solid #f9f9f9; text-align: center; }
        .perc-badge { padding: 5px 10px; border-radius: 6px; font-weight: bold; font-size: 11px; display: inline-block; min-width: 45px; text-align: center; }

        .controls-bar { background: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex-wrap: wrap; }
        .controls-bar input { padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit; }
        .btn-filter { background: var(--blue); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-export { background: #4caf50; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: auto; transition: 0.2s; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="logo.jpg" alt="Elecnor Logo" style="max-height: 40px;" onerror="this.style.display='none'">
            <span class="brand">ELECNOR</span>
            <span class="app-name">PM DASHBOARD</span>
        </div>
        <div class="nav-container">
            <a href="prod-index.html" class="btn-nav-outline">⬅ MENÚ PRINCIPAL</a>
            <button class="btn-nav-outline" onclick="window.location.href='prod-index.html#mapa'">🗺️ MAPA OPERATIVO</button>
        </div>
    </header>

    <div class="kpi-container">
        <div class="kpi-card"><h3>Hincado</h3><p id="kpi-h-val">0</p></div>
        <div class="kpi-card"><h3>Piruletas</h3><p id="kpi-p-val">0</p></div>
        <div class="kpi-card"><h3>Torque Tubes</h3><p id="kpi-t-val">0</p></div>
        <div class="kpi-card"><h3>Omegas</h3><p id="kpi-o-val">0</p></div>
        <div class="kpi-card"><h3>Módulos</h3><p id="kpi-m-val">0</p></div>
    </div>

    <div class="controls-bar" id="date-controls">
        <strong style="color:var(--blue);">Filtro de Fechas:</strong>
        <div>Desde: <input type="date" id="date-from"></div>
        <div>Hasta: <input type="date" id="date-to"></div>
        <button class="btn-filter" onclick="applyFilters()">Aplicar Filtro</button>
        <button class="btn-export" onclick="exportToExcel()">📥 Exportar Reporte</button>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('global', this)">Resumen Estratégico</div>
        <div class="tab" onclick="switchTab('detalle', this)">Análisis por Arco</div>
    </div>

    <div id="view-global" class="view active"></div>

    <div id="view-detalle" class="view">
        <div style="background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px;">
            <strong>Arco de Trabajo:</strong>
            <select id="select-arco-dash" style="padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-weight:bold; color:var(--blue);"></select>
        </div>
        <div id="detalle-content"></div>
    </div>

    <script src="prod-dashboard.js"></script>
</body>
</html>
